<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - Restaurante</title>
    <link rel="stylesheet" href="atendente.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Reservas - Restaurante</h1>
        
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="atendente">Atendente</button>
                <button class="tab-btn" data-tab="garcom">Garçom</button>
                <button class="tab-btn" data-tab="gerente">Gerente</button>
            </div>
            
            <div id="atendente" class="tab-content active">
                <h2>Nova Reserva</h2>
                <form id="form-reserva">
                    <div class="form-group"><label for="nome">Nome do responsável:</label><input type="text" id="nome" required placeholder="Digite o nome completo"></div>
                    <div class="form-group"><label for="data">Data:</label><input type="date" id="data" required></div>
                    <div class="form-group"><label for="hora">Hora:</label><input type="time" id="hora" required></div>
                    <div class="form-group"><label for="mesa">Número da mesa:</label><input type="number" id="mesa" min="1" max="20" required placeholder="Ex: 5"></div>
                    <div class="form-group"><label for="pessoas">Quantidade de pessoas:</label><input type="number" id="pessoas" min="1" max="20" required placeholder="Ex: 4"></div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Criar Reserva</button>
                        <button type="button" id="btn-cancelar-atendente" class="btn-danger">Cancelar Reserva</button>
                    </div>
                </form>
                <div id="msg-atendente" class="message"></div>
            </div>
            
            <div id="garcom" class="tab-content">
                <h2>Painel do Garçom</h2>
                <div class="form-group">
                    <label for="garcom-select">Selecione seu nome:</label>
                    <select id="garcom-select" class="input-field"><option value="">-- Selecione --</option></select>
                </div>
                <hr>
                <h3>Reservas Pendentes para Hoje</h3>
                <div id="lista-reservas-pendentes"><p>Selecione seu nome para ver as reservas.</p></div>
            </div>
            
            <div id="gerente" class="tab-content">
                <h2>Painel do Gerente</h2>
                <div class="gerente-nav">
                    <button id="btn-gerenciar-garcons" class="gerente-nav-btn active">Gerenciar Garçons</button>
                    <button id="btn-ver-relatorios" class="gerente-nav-btn">Ver Relatórios</button>
                </div>

                <div id="view-gerenciar-garcons" class="gerente-view active">
                    <h3>Cadastro de Garçons</h3>
                    <form id="form-cad-garcom">
                        <div class="form-group">
                            <label for="garcom-nome-input">Nome do Garçom:</label>
                            <input type="text" id="garcom-nome-input" required placeholder="Nome e sobrenome">
                        </div>
                        <div class="button-group">
                            <button type="submit" class="btn-primary">Cadastrar Garçom</button>
                        </div>
                    </form>
                    <div id="msg-gerente" class="message"></div>
                    <h4>Garçons Cadastrados</h4>
                    <div id="lista-garcons" class="report-output">Carregando...</div>
                </div>

                <div id="view-relatorios" class="gerente-view">
                    <h3>Relatórios de Reservas</h3>
                    <section>
                        <h4>Reservas entre datas</h4>
                        <form id="form-rel1">
                            <div class="form-group"><label for="inicio">Data início:</label><input type="date" id="inicio" required></div>
                            <div class="form-group"><label for="fim">Data fim:</label><input type="date" id="fim" required></div>
                            <div class="button-group"><button type="submit" class="btn-primary">Gerar Relatório</button></div>
                        </form>
                        <div id="rel1" class="report-output"></div>
                    </section>
                    <hr>
                    <section>
                        <h4>Reservas por mesa</h4>
                        <form id="form-rel2">
                            <div class="form-group"><label for="mesa-gerente">Mesa:</label><input type="number" id="mesa-gerente" min="1" max="20" required></div>
                            <div class="button-group"><button type="submit" class="btn-primary">Gerar Relatório</button></div>
                        </form>
                        <div id="rel2" class="report-output"></div>
                    </section>
                    <hr>
                    <section>
                        <h4>Reservas por garçom</h4>
                        <form id="form-rel3">
                            <div class="form-group"><label for="garcom-gerente">Garçom:</label><input type="text" id="garcom-gerente" required placeholder="Nome do garçom"></div>
                            <div class="button-group"><button type="submit" class="btn-primary">Gerar Relatório</button></div>
                        </form>
                        <div id="rel3" class="report-output"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
